name: Build B2G Core Binaries for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-core-windows:
    # Runs natively on GitHub's official Ubuntu 22.04 host runner
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Engine Source Code
        uses: actions/checkout@v4

      # Free up massive space natively on the host runner
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # Install Python 3 development libraries and the MinGW cross-compiler
      - name: Install Toolchains and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip unzip python3 python3-pip mingw-w64 g++-mingw-w64 binutils-mingw-w64

      # Locate mach and write the .mozconfig beside it
      - name: Locate Mach and Configure Mozconfig
        run: |
          MACH_PATH=$(find . -maxdepth 3 -name "mach" -not -path "*/.*" | head -n 1)
          
          if [ -z "$MACH_PATH" ]; then
            echo "ERROR: Could not find any file named 'mach' anywhere in your repository!"
            exit 1
          fi
          
          MACH_PATH=$(echo "$MACH_PATH" | sed 's|^\./||')
          TARGET_DIR=$(dirname "$MACH_PATH")
          echo "Found mach inside folder: $TARGET_DIR"
          
          chmod +x "$MACH_PATH"
          
          # Write your specific .mozconfig next to mach
          cat << 'EOF' > "$TARGET_DIR/.mozconfig"
          # Target architecture (use i686-w64-mingw32 for 32-bit Windows)
          ac_add_options --target=x86_64-w64-mingw32

          # Define application type as B2G Desktop
          ac_add_options --enable-application=b2g

          # Build optimizations
          ac_add_options --enable-optimize
          ac_add_options --disable-debug

          # Use internal/standard dependencies required for cross-compiling
          ac_add_options --with-toolchain-prefix=x86_64-w64-mingw32-
          EOF
          
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV

      # Run the build natively on the runner using Python 3
      - name: Compile B2G Core Engine
        run: |
          cd ${{ env.TARGET_DIR }}
          python3 ./mach build

      # Package the final output windows executable bundle
      - name: Package Core Executable Files
        run: |
          mkdir -p b2g-core-windows
          cp -r ${{ env.TARGET_DIR }}/obj-*/dist/bin/* b2g-core-windows/
          zip -r b2g-windows-binaries.zip b2g-core-windows/

      # Upload final zip package to your browser view
      - name: Upload Finished Binaries
        uses: actions/upload-artifact@v4
        with:
          name: B2G-Core-Windows-Binaries
          path: b2g-windows-binaries.zip
