name: Build B2G Core Binaries for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-core-windows:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Engine Source Code
        uses: actions/checkout@v4

      # Free up space on the cloud disk
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      # Redirect Docker to use the freshly cleared disk space partition
      - name: Redirect Docker Daemon Storage Location
        run: |
          sudo systemctl stop docker
          sudo mkdir -p ${{ github.workspace }}/docker-space
          echo '{
            "data-root": "'${{ github.workspace }}'/docker-space"
          }' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker

      # Step 1: Create the Ubuntu 20.04 environment blueprint
      - name: Create Legacy Compiler Container Blueprint
        run: |
          cat << 'EOF' > Dockerfile.build
          FROM ubuntu:20.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y \
              build-essential zip unzip python2 mingw-w64 g++-mingw-w64 binutils-mingw-w64 \
              && rm -rf /var/lib/apt/lists/*
          RUN ln -sf /usr/bin/python2 /usr/bin/python
          WORKDIR /workspace
          EOF

      # Step 2: Build the compiler container on the cloud machine
      - name: Build Compiler Image
        run: docker build -t b2g-compiler:latest -f Dockerfile.build .

      # Step 3: Find mach, create .mozconfig relative to it, and fix permissions
      - name: Locate Mach and Configure Mozconfig
        run: |
          # Automatically search for where the 'mach' file is stored in your repo
          MACH_PATH=$(find . -name "mach" -maxdepth 3 | head -n 1)
          
          if [ -z "$MACH_PATH" ]; then
            echo "ERROR: Could not find any file named 'mach' anywhere in your repository!"
            exit 1
          fi
          
          # Extract the directory containing mach
          TARGET_DIR=$(dirname "$MACH_PATH")
          echo "Found mach inside folder: $TARGET_DIR"
          
          # Make sure linux has permissions to execute the mach script
          chmod +x "$TARGET_DIR/mach"
          
          # Write the .mozconfig file directly alongside your mach script
          cat << 'EOF' > "$TARGET_DIR/.mozconfig"
          # Target architecture (use i686-w64-mingw32 for 32-bit Windows)
          ac_add_options --target=x86_64-w64-mingw32

          # Define application type as B2G Desktop
          ac_add_options --enable-application=b2g

          # Build optimizations
          ac_add_options --enable-optimize
          ac_add_options --disable-debug

          # Use internal/standard dependencies required for cross-compiling
          ac_add_options --with-toolchain-prefix=x86_64-w64-mingw32-
          EOF
          
          # Save the detected folder path for the next compilation steps to use
          echo "TARGET_DIR=$TARGET_DIR" >> $GITHUB_ENV

      # Step 4: Inject the directory inside the container and compile via mach
      - name: Compile B2G Core Engine
        run: |
          # Navigate to the folder containing mach inside the container environment
          docker run --rm -v ${{ github.workspace }}:/workspace b2g-compiler:latest bash -c "
            cd /workspace/${{ env.TARGET_DIR }}
            ./mach build
          "

      # Step 5: Extract and package the resulting compilation binaries
      - name: Package Core Executable Files
        run: |
          mkdir -p b2g-core-windows
          # Find the compiled output binaries based on our target folder directory
          cp -r ${{ env.TARGET_DIR }}/obj-*/dist/bin/* b2g-core-windows/
          zip -r b2g-windows-binaries.zip b2g-core-windows/

      # Step 6: Upload the final zip bundle to your GitHub Actions run page
      - name: Upload Finished Binaries
        uses: actions/upload-artifact@v4
        with:
          name: B2G-Core-Windows-Binaries
          path: b2g-windows-binaries.zip
