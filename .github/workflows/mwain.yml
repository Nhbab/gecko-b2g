name: Build Firefox OS Windows Binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Free up space natively on the host runner for heavy source files
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      # Install Python 3 requirements and standard cross-compiler binaries
      - name: Install System Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip unzip python3 python3-pip python3-dev \
            mingw-w64 g++-mingw-w64 binutils-mingw-w64 m4 ccache

      # Inject your configuration options directly into the workspace root
      - name: Configure Mozilla Mozconfig
        run: |
          cat << 'EOF' > .mozconfig
          # Target architecture (use i686-w64-mingw32 for 32-bit Windows)
          ac_add_options --target=x86_64-w64-mingw32

          # Define application type as B2G Desktop
          ac_add_options --enable-application=b2g

          # Build optimizations
          ac_add_options --enable-optimize
          ac_add_options --disable-debug

          # Use internal/standard dependencies required for cross-compiling
          ac_add_options --with-toolchain-prefix=x86_64-w64-mingw32-
          EOF

      # Explicitly make sure the workspace engine recognizes mach as a runnable script
      - name: Fix Script Permissions
        run: |
          if [ -f "./mach" ]; then
            chmod +x ./mach
            echo "Mach confirmed at root level."
          else
            echo "ERROR: mach file was not detected at root. Current root files are:"
            ls -la
            exit 1
          fi

      # Run the compilation directly via the Python 3 interpreter
      - name: Compile Windows Binaries
        run: |
          # Calling python3 explicitly ignores execution path system blocks
          python3 ./mach build

      # Package the true compiled Windows application components from the object tree
      - name: Package Windows Binary Output
        run: |
          mkdir -p b2g-windows-binaries
          cp -r obj-*/dist/bin/* b2g-windows-binaries/
          zip -r finished-windows-build.zip b2g-windows-binaries/

      # Save the final compiled application package to your GitHub browser tab
      - name: Upload Finished Binaries
        uses: actions/upload-artifact@v4
        with:
          name: B2G-Windows-Full-Build
          path: finished-windows-build.zip
