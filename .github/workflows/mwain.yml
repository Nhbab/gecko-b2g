name: Build B2G Core Binaries for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-core-windows:
    # Runs on the modern free cloud infrastructure
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Engine Source Code
        uses: actions/checkout@v4

      # Clear up space so the Docker compiler layer doesn't crash from lack of disk
      - name: Maximize Disk Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      # Step 1: Create the Ubuntu 20.04 environment blueprint
      - name: Create Legacy Compiler Container Blueprint
        run: |
          cat << 'EOF' > Dockerfile.build
          FROM ubuntu:20.04
          ENV DEBIAN_FRONTEND=noninteractive
          
          # Install core compilers, Python 2 system engine, and MinGW
          RUN apt-get update && apt-get install -y \
              build-essential zip unzip python2 mingw-w64 g++-mingw-w64 binutils-mingw-w64 \
              && rm -rf /var/lib/apt/lists/*
              
          # Manually establish the /usr/bin/python interpreter alias link for mach
          RUN ln -sf /usr/bin/python2 /usr/bin/python
          
          WORKDIR /workspace
          EOF

      # Step 2: Build the compiler container on the cloud machine
      - name: Build Compiler Image
        run: docker build -t b2g-compiler:latest -f Dockerfile.build .

      # Step 3: Write your exact configuration parameters into the source tree
      - name: Configure Mozconfig
        run: |
          cat << 'EOF' > .mozconfig
          # Target architecture (use i686-w64-mingw32 for 32-bit Windows)
          ac_add_options --target=x86_64-w64-mingw32

          # Define application type as B2G Desktop
          ac_add_options --enable-application=b2g

          # Build optimizations
          ac_add_options --enable-optimize
          ac_add_options --disable-debug

          # Use internal/standard dependencies required for cross-compiling
          ac_add_options --with-toolchain-prefix=x86_64-w64-mingw32-
          EOF

      # Step 4: Inject the source directory inside the container and compile via mach
      - name: Compile B2G Core Engine
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace b2g-compiler:latest ./mach build

      # Step 5: Extract and package the resulting compilation binaries
      - name: Package Core Executable Files
        run: |
          mkdir -p b2g-core-windows
          cp -r obj-*/dist/bin/* b2g-core-windows/
          zip -r b2g-windows-binaries.zip b2g-core-windows/

      # Step 6: Upload the final zip bundle to your GitHub Actions run page
      - name: Upload Finished Binaries
        uses: actions/upload-artifact@v4
        with:
          name: B2G-Core-Windows-Binaries
          path: b2g-windows-binaries.zip
